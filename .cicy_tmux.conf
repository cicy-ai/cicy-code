case "$-" in
    *i*) echo "cicy tmux inited!!" ;;
esac
export CICY_TMUX=1
export CICY_VERSION="2.0.1"

mkdir -p "$HOME/.cicy"
export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
case " ${NODE_OPTIONS:-} " in *" --max-old-space-size="*) ;; *) export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--max-old-space-size=3072" ;; esac

function __cicy_refresh_command_path() {
    local command_name="$1"
    local bin_dir=""
    hash -r 2>/dev/null || true
    if command -v "$command_name" >/dev/null 2>&1; then
        return 0
    fi
    for bin_dir in "$HOME/.npm-global/bin" "$HOME/.local/bin" "$HOME/.opencode/bin"; do
        if [ ! -x "$bin_dir/$command_name" ]; then
            continue
        fi
        case ":$PATH:" in
            *":$bin_dir:"*) ;;
            *) export PATH="$bin_dir:$PATH" ;;
        esac
    done
    hash -r 2>/dev/null || true
    command -v "$command_name" >/dev/null 2>&1
}

function __cicy_require_command() {
    local command_name="$1"
    local label="$2"
    local install_cmd="$3"
    local install_log="$4"
    if __cicy_refresh_command_path "$command_name"; then
        return 0
    fi
    if [ -z "$install_cmd" ]; then
        echo '[cicy] =================================================='
        echo "[cicy] ${label} 未找到，请更新基础镜像后重启"
        echo '[cicy] =================================================='
        return 1
    fi
    echo '[cicy] =================================================='
    echo "[cicy] ${label} 未安装，正在安装..."
    echo '[cicy] 可能需要 1-5 分钟，取决于网络速度'
    echo '[cicy] =================================================='
    (
        bash -lc "$install_cmd"
    ) >"$install_log" 2>&1 &
    local install_pid=$!
    local elapsed=0
    while kill -0 "$install_pid" 2>/dev/null; do
        elapsed=$((elapsed + 1))
        local filled=$(((elapsed % 20) + 1))
        local bar
        local pad
        bar=$(printf '%-*s' "$filled" '' | tr ' ' '#')
        pad=$(printf '%-*s' $((20 - filled)) '')
        printf '\r[cicy] [%s%s] 正在安装 %s... %3ss' "$bar" "$pad" "$label" "$elapsed"
        sleep 1
    done
    wait "$install_pid"
    local install_status=$?
    printf '\n'
    if [ "$install_status" -ne 0 ]; then
        echo "[cicy] ${label} 安装失败，最近日志："
        tail -100 "$install_log"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    if ! __cicy_refresh_command_path "$command_name"; then
        echo "[cicy] ${label} 安装完成，但当前 shell 仍找不到命令: $command_name"
        echo "[cicy] 当前 PATH: $PATH"
        if [ -f "$HOME/.opencode/bin/$command_name" ]; then
            echo "[cicy] 检测到安装产物: $HOME/.opencode/bin/$command_name"
        fi
        if [ -f "$HOME/.npm-global/bin/$command_name" ]; then
            echo "[cicy] 检测到安装产物: $HOME/.npm-global/bin/$command_name"
        fi
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    echo "[cicy] ${label} 安装完成"
}

function __cicy_require_command_live() {
    local command_name="$1"
    local label="$2"
    local install_cmd="$3"
    local install_log="$4"
    if __cicy_refresh_command_path "$command_name"; then
        return 0
    fi
    if [ -z "$install_cmd" ]; then
        echo '[cicy] =================================================='
        echo "[cicy] ${label} 未找到，请更新基础镜像后重启"
        echo '[cicy] =================================================='
        return 1
    fi
    mkdir -p "$(dirname "$install_log")"
    : >"$install_log"
    echo '[cicy] =================================================='
    echo "[cicy] ${label} 未安装，正在安装..."
    echo '[cicy] 正在显示实时下载进度，请稍候'
    echo '[cicy] =================================================='
    (
        set -o pipefail
        eval "$install_cmd" 2>&1 | tee "$install_log"
    )
    local install_status=$?
    if [ "$install_status" -ne 0 ]; then
        echo "[cicy] ${label} 安装失败，最近日志："
        tail -100 "$install_log"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    if ! __cicy_refresh_command_path "$command_name"; then
        echo "[cicy] ${label} 安装完成，但当前 shell 仍找不到命令: $command_name"
        echo "[cicy] 当前 PATH: $PATH"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    echo "[cicy] ${label} 安装完成"
}

function __cicy_kiro_checksum_from_manifest() {
    local manifest_path="$1"
    local filename="$2"
    if command -v jq >/dev/null 2>&1; then
        jq -r --arg name "$filename" '.packages[] | select(.download | endswith($name)) | .sha256 // empty' "$manifest_path"
        return 0
    fi
    python3 - "$manifest_path" "$filename" <<'PY'
import json
import sys

manifest_path, filename = sys.argv[1], sys.argv[2]
with open(manifest_path, "r", encoding="utf-8") as fh:
    data = json.load(fh)
for pkg in data.get("packages", []):
    download = str(pkg.get("download", ""))
    if download.endswith(filename):
        print(pkg.get("sha256", ""))
        break
PY
}

function __cicy_install_kiro_cli_with_progress() {
    local arch_raw arch suffix filename channel_base_url manifest_url download_url
    local download_dir manifest_path zip_path extract_dir install_script expected_checksum actual_checksum
    arch_raw="$(uname -m)"
    case "$arch_raw" in
        x86_64|amd64) arch="x86_64" ;;
        aarch64|arm64) arch="aarch64" ;;
        *)
            echo "[cicy] 不支持的 Kiro CLI 架构: $arch_raw"
            return 1
            ;;
    esac
    suffix=""
    if command -v ldd >/dev/null 2>&1; then
        if ldd --version 2>&1 | grep -qi musl || ldd /bin/ls 2>&1 | grep -qi musl; then
            suffix="-musl"
        fi
    fi
    filename="kirocli-${arch}-linux${suffix}.zip"
    channel_base_url="https://prod.download.cli.kiro.dev/stable"
    manifest_url="${channel_base_url}/latest/manifest.json"
    download_url="${channel_base_url}/latest/${filename}"
    download_dir="$(mktemp -d "${TMPDIR:-/tmp}/kiro-cli-install-XXXXXX")"
    manifest_path="$download_dir/manifest.json"
    zip_path="$download_dir/$filename"
    extract_dir="$download_dir/extract"
    echo "[cicy] 下载地址: $download_url"
    echo "[cicy] 获取校验清单..."
    curl -fsSL -o "$manifest_path" "$manifest_url"
    expected_checksum="$(__cicy_kiro_checksum_from_manifest "$manifest_path" "$filename" | tr -d '\r\n')"
    if [ -z "$expected_checksum" ]; then
        echo "[cicy] 未找到 Kiro CLI 校验和: $filename"
        rm -rf "$download_dir"
        return 1
    fi
    echo "[cicy] 开始下载 Kiro CLI 安装包..."
    curl -fL -o "$zip_path" "$download_url"
    actual_checksum="$(sha256sum "$zip_path" | awk '{print $1}')"
    if [ "$actual_checksum" != "$expected_checksum" ]; then
        echo "[cicy] Kiro CLI 校验失败"
        echo "[cicy] expected: $expected_checksum"
        echo "[cicy] actual:   $actual_checksum"
        rm -rf "$download_dir"
        return 1
    fi
    mkdir -p "$extract_dir"
    unzip -q "$zip_path" -d "$extract_dir"
    install_script="$extract_dir/kirocli/install.sh"
    if [ ! -f "$install_script" ]; then
        echo "[cicy] Kiro CLI 安装脚本不存在: $install_script"
        rm -rf "$download_dir"
        return 1
    fi
    chmod +x "$install_script"
    KIRO_CLI_SKIP_SETUP=1 "$install_script"
    rm -rf "$download_dir"
}

# 启用颜色
export TERM=xterm-256color

# Prompt: bash/zsh 分开设置，避免 zsh 直接打印 bash 的 PS1 转义串
if [ -n "${ZSH_VERSION:-}" ]; then
    autoload -Uz vcs_info 2>/dev/null || true
    zstyle ':vcs_info:*' enable git
    zstyle ':vcs_info:git:*' formats ' %F{208}(%b)%f'
    setopt PROMPT_SUBST
    function __cicy_update_zsh_prompt() {
        vcs_info >/dev/null 2>&1
        PROMPT='%1~${vcs_info_msg_0_} %F{cyan}$%f '
    }
    if [[ -z "${precmd_functions[(r)__cicy_update_zsh_prompt]}" ]]; then
        precmd_functions+=(__cicy_update_zsh_prompt)
    fi
    __cicy_update_zsh_prompt
elif [ -n "${BASH_VERSION:-}" ]; then
    PS1='\W\[\033[38;5;208m\]$(__git_ps1 " (%s)")\[\033[0m\] \[\033[01;36m\]$\[\033[0m\] '
    if ! command -v __git_ps1 >/dev/null 2>&1; then
        PS1='\W \[\033[01;36m\]$\[\033[0m\] '
    fi
fi

# ls 颜色
if ls --color=auto >/dev/null 2>&1; then
    alias ls='ls --color=auto'
    alias ll='ls -la --color=auto'
else
    alias ls='ls -G'
    alias ll='ls -laG'
fi

function __cicy_proxy_config_path() {
    printf '%s\n' "${CICY_PROXY_CONFIG:-$HOME/proxy.json}"
}

function __cicy_proxy_have_jq() {
    command -v jq >/dev/null 2>&1
}

function __cicy_proxy_resolve_url() {
    local key="$1"
    local config
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        return 1
    fi
    jq -er --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .proxy_url' "$config"
}

function __cicy_proxy_env_url() {
    local proxy_url="$1"
    case "$proxy_url" in
        socks5://*)
            printf '%s\n' "socks5h://${proxy_url#socks5://}"
            ;;
        *)
            printf '%s\n' "$proxy_url"
            ;;
    esac
}

function __cicy_proxy_exec_field() {
    local key="$1"
    local field="$2"
    local config cmd
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        echo "proxy: config not ready: $config"
        return 1
    fi
    cmd="$(jq -er --arg key "$key" --arg field "$field" '.ssh_proxies[] | select(.name == $key) | .[$field]' "$config")" || {
        echo "proxy: missing $field for $key"
        return 1
    }
    bash -lc "$cmd"
}

function __cicy_proxy_get_field() {
    local key="$1"
    local field="$2"
    local config
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        return 1
    fi
    jq -r --arg key "$key" --arg field "$field" '.ssh_proxies[] | select(.name == $key) | .[$field] // empty' "$config"
}

function __cicy_proxy_status_text() {
    local key="$1"
    local config local_port ssh_host ssh_host_name ssh_target
    config="$(__cicy_proxy_config_path)"
    if ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        printf '%s\n' "-"
        return 0
    fi
    local_port="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .local_port // empty' "$config")"
    ssh_host="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .ssh_host // empty' "$config")"
    ssh_host_name="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .ssh_host_name // empty' "$config")"
    ssh_target="$ssh_host_name"
    if [ -z "$ssh_target" ]; then
        ssh_target="$ssh_host"
    fi
    if [ -n "$local_port" ] && [ -n "$ssh_target" ] && pgrep -af "ssh .* -D ${local_port} .*(${ssh_target}|${ssh_host})" >/dev/null 2>&1; then
        printf '%s\n' "running"
        return 0
    fi
    printf '%s\n' "stopped"
}

function __cicy_proxy_find_ssh_pids() {
    local key="$1"
    local local_port ssh_host ssh_host_name ssh_target
    local_port="$(__cicy_proxy_get_field "$key" "local_port")"
    ssh_host="$(__cicy_proxy_get_field "$key" "ssh_host")"
    ssh_host_name="$(__cicy_proxy_get_field "$key" "ssh_host_name")"
    ssh_target="$ssh_host_name"
    if [ -z "$ssh_target" ]; then
        ssh_target="$ssh_host"
    fi
    if [ -z "$local_port" ] || [ -z "$ssh_target" ]; then
        return 1
    fi
    ps -eo pid=,args= | awk -v port="$local_port" -v host="$ssh_target" -v host2="$ssh_host" '
        {
            pid = $1
            $1 = ""
            args = substr($0, 2)
            if (args !~ /^ssh[[:space:]]/) {
                next
            }
            if (args !~ ("(^|[[:space:]])-D[[:space:]]+" port "([[:space:]]|$)")) {
                next
            }
            if (index(args, host) || (host2 != "" && index(args, host2))) {
                print pid
            }
        }
    '
}

function __cicy_proxy_force_stop() {
    local key="$1"
    local pids=""
    local remaining=""
    pids="$(__cicy_proxy_find_ssh_pids "$key" | tr '\n' ' ')"
    if [ -z "${pids// }" ]; then
        return 1
    fi
    kill $pids 2>/dev/null || sudo -n kill $pids 2>/dev/null || true
    sleep 1
    remaining="$(__cicy_proxy_find_ssh_pids "$key" | tr '\n' ' ')"
    if [ -n "${remaining// }" ]; then
        kill -9 $remaining 2>/dev/null || sudo -n kill -9 $remaining 2>/dev/null || true
        sleep 1
    fi
    return 0
}

function __cicy_proxy_stop_profile() {
    local key="$1"
    local profile_status=""
    if [ -z "$key" ]; then
        echo "proxy: missing key"
        return 1
    fi
    profile_status="$(__cicy_proxy_status_text "$key")"
    if [ "$profile_status" != "running" ]; then
        echo "proxy: profile $key is $profile_status"
        return 0
    fi
    __cicy_proxy_exec_field "$key" "stop_cmd" >/dev/null 2>&1 || true
    __cicy_proxy_force_stop "$key" >/dev/null 2>&1 || true
    profile_status="$(__cicy_proxy_status_text "$key")"
    if [ "$profile_status" = "running" ]; then
        echo "proxy: failed to stop $key"
        return 1
    fi
    echo "proxy: stopped $key"
}

function __cicy_proxy_print_on_hint() {
    local key="$1"
    if [ -n "$key" ] && [[ "$key" != *"://"* ]]; then
        echo "请用 proxy on $key 开启代理"
    fi
}

function __cicy_proxy_auto_test() {
    local key="$1"
    if [ -z "$key" ] || [[ "$key" == *"://"* ]]; then
        return 0
    fi
    echo "proxy: testing $key"
    proxy test "$key"
}

function __cicy_var_is_set() {
    local name="$1"
    eval "[ \"\${${name}+x}\" = x ]"
}

function __cicy_var_get() {
    local name="$1"
    eval "printf '%s' \"\${${name}:-}\""
}

function __cicy_var_set() {
    local name="$1"
    local value="$2"
    if [ -n "${ZSH_VERSION:-}" ]; then
        typeset -g "$name=$value"
    elif [ -n "${BASH_VERSION:-}" ]; then
        printf -v "$name" '%s' "$value"
    else
        eval "$name=\$value"
    fi
    export "$name"
}

function __cicy_proxy_append_csv_unique() {
    local current="$1"
    local addition="$2"
    awk -v current="$current" -v addition="$addition" '
        function append_csv(csv,    n, arr, i, item) {
            n = split(csv, arr, ",")
            for (i = 1; i <= n; i++) {
                item = arr[i]
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", item)
                if (item == "" || seen[item]) {
                    continue
                }
                seen[item] = 1
                if (out != "") {
                    out = out "," item
                } else {
                    out = item
                }
            }
        }
        BEGIN {
            append_csv(current)
            append_csv(addition)
            print out
        }
    '
}

function __cicy_proxy_local_ips() {
    local out=""
    if command -v ipconfig >/dev/null 2>&1; then
        local ip
        for ip in \
            "$(ipconfig getifaddr en0 2>/dev/null)" \
            "$(ipconfig getifaddr en1 2>/dev/null)" \
            "$(ipconfig getifaddr en5 2>/dev/null)" \
            "$(ipconfig getifaddr en6 2>/dev/null)"; do
            case "$ip" in
                ""|127.*) ;;
                *) out="$(__cicy_proxy_append_csv_unique "$out" "$ip")" ;;
            esac
        done
    fi
    if [ -z "$out" ] && command -v hostname >/dev/null 2>&1; then
        local ip
        for ip in $(hostname -I 2>/dev/null); do
            case "$ip" in
                ""|127.*) ;;
                *) out="$(__cicy_proxy_append_csv_unique "$out" "$ip")" ;;
            esac
        done
    fi
    printf '%s\n' "$out"
}

function __cicy_proxy_default_no_proxy() {
    local defaults="localhost,127.0.0.1,::1,192.168.0.0/16"
    local local_ips
    local_ips="$(__cicy_proxy_local_ips)"
    printf '%s\n' "$(__cicy_proxy_append_csv_unique "$defaults" "$local_ips")"
}

function __cicy_proxy_save_current() {
    local name backup
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        backup="CICY_PROXY_SAVED_${name}"
        if __cicy_var_is_set "$backup"; then
            continue
        fi
        if __cicy_var_is_set "$name"; then
            __cicy_var_set "$backup" "$(__cicy_var_get "$name")"
        else
            __cicy_var_set "$backup" "__CICY_PROXY_UNSET__"
        fi
    done
}

function __cicy_proxy_restore_current() {
    local name backup saved
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        backup="CICY_PROXY_SAVED_${name}"
        if ! __cicy_var_is_set "$backup"; then
            unset "$name"
            continue
        fi
        saved="$(__cicy_var_get "$backup")"
        if [ "$saved" = "__CICY_PROXY_UNSET__" ]; then
            unset "$name"
        else
            __cicy_var_set "$name" "$saved"
        fi
        unset "$backup"
    done
}

function __cicy_proxy_list() {
    local name shown=0 env_value
    local config
    config="$(__cicy_proxy_config_path)"
    if __cicy_proxy_have_jq && [ -f "$config" ]; then
        echo "proxy profiles ($config)"
        while IFS=$'\t' read -r key scheme proxy_url; do
            [ -n "$key" ] || continue
            printf "  %-16s %-8s %-8s %s\n" "$key" "$scheme" "$(__cicy_proxy_status_text "$key")" "$proxy_url"
            shown=1
        done < <(jq -r '.ssh_proxies[] | [.name, (.scheme // ""), (.proxy_url // "")] | @tsv' "$config")
    fi
    if [ "$shown" -eq 0 ]; then
        echo "proxy profiles: none"
    fi
    echo "proxy env"
    shown=0
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        if __cicy_var_is_set "$name"; then
            env_value="$(__cicy_var_get "$name")"
            if [ -n "$env_value" ]; then
                printf "  %-12s %s\n" "$name" "$env_value"
                shown=1
            fi
        fi
    done
    if [ -n "${CICY_PROXY_URL:-}" ]; then
        printf "  %-12s %s\n" "CICY_PROXY_URL" "$CICY_PROXY_URL"
        shown=1
    fi
    if [ -n "${CICY_PROXY_KEY:-}" ]; then
        printf "  %-12s %s\n" "CICY_PROXY_KEY" "$CICY_PROXY_KEY"
        shown=1
    fi
    if [ "$shown" -eq 0 ]; then
        echo "  no active proxy env vars"
    fi
}

function __cicy_proxy_help() {
    echo "usage: proxy <list|on|off|test|start|stop|restart|help> [key|url]"
    echo "  proxy list         list proxy profiles from ~/proxy.json and current env"
    echo "  proxy on <key>     enable proxy env with proxy_url from ~/proxy.json"
    echo "  proxy on <url>     enable proxy env directly with a proxy url"
    echo "  proxy off          disable proxy and restore previous env vars"
    echo "  proxy start <key>  run start_cmd for the given proxy profile"
    echo "  proxy stop <key>   run stop_cmd for the given proxy profile"
    echo "  proxy restart <key> stop and start the given proxy profile"
    echo "  proxy test <key>   run test_cmd for the given proxy profile"
    echo "  proxy test [url]   curl the target with current proxy env (default: https://example.com)"
    echo "  proxy help         show this help"
}

function proxy() {
    local subcmd="${1:-help}"
    shift || true

    case "$subcmd" in
        on)
            local key_or_url="${1:-${CICY_PROXY_KEY:-${CICY_PROXY_URL:-}}}"
            local proxy_url=""
            local proxy_env_url=""
            local profile_status=""
            local merged_no_proxy=""
            local test_status=0
            if [ -n "$key_or_url" ] && [[ "$key_or_url" == *"://"* ]]; then
                proxy_url="$key_or_url"
            elif [ -n "$key_or_url" ]; then
                proxy_url="$(__cicy_proxy_resolve_url "$key_or_url")" || {
                    echo "proxy: unknown key or invalid config: $key_or_url"
                    return 1
                }
            fi
            if [ -z "$proxy_url" ]; then
                echo "proxy: missing proxy key or url"
                __cicy_proxy_help
                return 1
            fi
            __cicy_proxy_save_current
            proxy_env_url="$(__cicy_proxy_env_url "$proxy_url")"
            export CICY_PROXY_KEY=""
            if [ -n "$key_or_url" ] && [[ "$key_or_url" != *"://"* ]]; then
                export CICY_PROXY_KEY="$key_or_url"
            fi
            export CICY_PROXY_URL="$proxy_env_url"
            export HTTP_PROXY="$proxy_env_url"
            export HTTPS_PROXY="$proxy_env_url"
            export ALL_PROXY="$proxy_env_url"
            export http_proxy="$proxy_env_url"
            export https_proxy="$proxy_env_url"
            export all_proxy="$proxy_env_url"
            merged_no_proxy="$(__cicy_proxy_append_csv_unique "${NO_PROXY:-${no_proxy:-}}" "$(__cicy_proxy_default_no_proxy)")"
            export NO_PROXY="$merged_no_proxy"
            export no_proxy="$merged_no_proxy"
            echo "proxy: enabled $proxy_env_url"
            if [ -n "$key_or_url" ] && [[ "$key_or_url" != *"://"* ]]; then
                profile_status="$(__cicy_proxy_status_text "$key_or_url")"
                if [ "$profile_status" != "running" ]; then
                    echo "proxy: profile $key_or_url is $profile_status. Run: proxy start $key_or_url"
                fi
            fi
            __cicy_proxy_list
            if [ -n "$key_or_url" ] && [[ "$key_or_url" != *"://"* ]] && [ "$profile_status" = "running" ]; then
                __cicy_proxy_auto_test "$key_or_url"
                test_status=$?
            fi
            return "$test_status"
            ;;
        off)
            __cicy_proxy_restore_current
            unset CICY_PROXY_KEY
            unset CICY_PROXY_URL
            echo "proxy: disabled"
            __cicy_proxy_list
            ;;
        list|status)
            __cicy_proxy_list
            ;;
        start)
            if [ -z "${1:-}" ]; then
                echo "proxy: missing key"
                return 1
            fi
            if [ "$(__cicy_proxy_status_text "$1")" = "running" ]; then
                echo "proxy: profile $1 already running"
                echo "proxy: if traffic is unhealthy, run proxy restart $1"
                __cicy_proxy_print_on_hint "$1"
                return 0
            fi
            __cicy_proxy_exec_field "$1" "start_cmd"
            local start_status=$?
            if [ "$start_status" -eq 0 ]; then
                __cicy_proxy_print_on_hint "$1"
            fi
            return "$start_status"
            ;;
        stop)
            __cicy_proxy_stop_profile "${1:-}"
            ;;
        restart)
            if [ -z "${1:-}" ]; then
                echo "proxy: missing key"
                return 1
            fi
            __cicy_proxy_stop_profile "$1" || return $?
            __cicy_proxy_exec_field "$1" "start_cmd"
            local restart_status=$?
            if [ "$restart_status" -eq 0 ]; then
                __cicy_proxy_print_on_hint "$1"
            fi
            return "$restart_status"
            ;;
        help|-h|--help)
            __cicy_proxy_help
            ;;
        test)
            if [ -n "${1:-}" ] && [[ "$1" != *"://"* ]] && __cicy_proxy_have_jq && [ -f "$(__cicy_proxy_config_path)" ]; then
                local profile_status
                profile_status="$(__cicy_proxy_status_text "$1")"
                if [ "$profile_status" != "running" ]; then
                    echo "proxy: profile $1 is $profile_status"
                    echo "proxy: run proxy start $1 first"
                    return 1
                fi
                __cicy_proxy_exec_field "$1" "test_cmd"
                local test_status=$?
                if [ "$test_status" -ne 0 ]; then
                    echo "proxy: test failed for $1"
                    echo "proxy: if the ssh tunnel is stale, run proxy restart $1"
                fi
                return "$test_status"
            fi
            local target="${1:-https://example.com}"
            if ! command -v curl >/dev/null 2>&1; then
                echo "proxy: curl not found"
                return 1
            fi
            echo "proxy: testing $target"
            curl -I --max-time 15 --connect-timeout 8 "$target"
            ;;
        *)
            echo "proxy: unknown subcommand: $subcmd"
            __cicy_proxy_help
            return 1
            ;;
    esac
}
