export CICY_TMUX=1
export CICY_VERSION="2.3.368"

mkdir -p "$HOME/.cicy"
# Running as root (Docker / Google Cloud Shell / Colab): the claude CLI refuses
# `--dangerously-skip-permissions` under root/sudo unless IS_SANDBOX is set. A
# cicy pane IS the sandbox, so mark it — otherwise claude/codex agents in a
# root container never launch (boot.sh gets past the CLI check but the CLI exits).
[ "$(id -u 2>/dev/null)" = "0" ] && export IS_SANDBOX=1
# Claude Code 2.1.x 默认用 fullscreen 渲染器(备用屏,像 vim/htop)——终端
# scrollback 彻底失效,tmux 历史永远是空的,web 终端的回填/上翻也就无从谈起。
# 强制回 classic 渲染器:transcript 内联打印、自然滚进 tmux 历史,配合
# cicy-code 的 attach 回填 + 客户端滚动,浏览器里才能真的上翻看历史。
# 想要单个 pane 回全屏:unset 后重启 claude,或会话内 /tui fullscreen。
export CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1
# Defensive: older versions of this file used to `export npm_config_prefix=...`,
# which nvm refuses. Unset on every source so long-running shells started
# under the old conf can clean themselves up by re-sourcing.
unset npm_config_prefix NPM_CONFIG_PREFIX
export CICY_BASE_PATH="$PATH"
export CICY_MANAGED_BIN_DIRS="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.opencode/bin"
export PATH="$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
export npm_config_registry="${npm_config_registry:-https://registry.npmmirror.com}"
export PIP_INDEX_URL="${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
export PIP_TRUSTED_HOST="${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}"
export GOPROXY="${GOPROXY:-https://goproxy.cn,direct}"
export GOSUMDB="${GOSUMDB:-sum.golang.google.cn}"
# Auto-detect network once per shell: if npmjs.org reachable within 3s,
# switch all mirrors to official upstreams (non-China network).
if [ -z "${CICY_MIRROR_DETECTED:-}" ]; then
    export CICY_MIRROR_DETECTED=1
    if curl -s --max-time 3 https://registry.npmjs.org/ >/dev/null 2>&1; then
        export npm_config_registry="https://registry.npmjs.org"
        export PIP_INDEX_URL="https://pypi.org/simple"
        export GOPROXY="https://proxy.golang.org,direct"
        export GOSUMDB="sum.golang.org"
        unset PIP_TRUSTED_HOST
    fi
fi

# user-local npm global prefix → `npm install -g` doesn't need sudo.
# Skip if nvm manages Node (nvm uses its own prefix per version and errors on
# any external prefix setting). Written via ~/.npmrc instead of env var so
# nvm's "npm_config_prefix" check stays clean.
if [ -z "${NVM_DIR:-}" ] && [ ! -f "$HOME/.npmrc" ]; then
    printf 'prefix=%s/.npm-global\n' "$HOME" > "$HOME/.npmrc"
fi
case " ${NODE_OPTIONS:-} " in *" --max-old-space-size="*) ;; *) export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--max-old-space-size=3072" ;; esac

function __cicy_refresh_command_path() {
    local command_name="$1"
    local bin_dir=""
    local external_path=""
    hash -r 2>/dev/null || true
    if [ -n "${CICY_BASE_PATH:-}" ]; then
        external_path="$(PATH="$CICY_BASE_PATH" command -v "$command_name" 2>/dev/null || true)"
        if [ -n "$external_path" ] && [ -x "$external_path" ]; then
            bin_dir="$(dirname "$external_path")"
            case ":$PATH:" in
                *":$bin_dir:"*) ;;
                *) export PATH="$bin_dir:$PATH" ;;
            esac
            hash -r 2>/dev/null || true
            return 0
        fi
    fi
    if command -v "$command_name" >/dev/null 2>&1; then
        return 0
    fi
    for bin_dir in "$HOME/.npm-global/bin" "$HOME/.local/bin" "$HOME/.opencode/bin"; do
        if [ ! -x "$bin_dir/$command_name" ]; then
            continue
        fi
        case ":$PATH:" in
            *":$bin_dir:"*) ;;
            *) export PATH="$bin_dir:$PATH" ;;
        esac
    done
    hash -r 2>/dev/null || true
    command -v "$command_name" >/dev/null 2>&1
}

function __cicy_check_command() {
    # Presence-only check — NO auto-install. Auto-install in the terminal was
    # removed: a missing CLI is installed on demand from the UI overlay (backend-
    # managed, with progress bar / retry / CN-mirror switch), then the agent is
    # restarted. Returns 0 if the CLI is present (boot continues and launches it);
    # prints a hint and returns 1 if missing, so the caller stops before launching.
    local command_name="$1"
    local label="$2"
    if __cicy_refresh_command_path "$command_name"; then
        return 0
    fi
    echo '[cicy] =================================================='
    echo "[cicy] ${label} 未安装，已跳过启动。"
    echo "[cicy] 请在界面上点击「安装 ${label}」；装好后会自动运行 source .cicy/boot.sh 启动。"
    echo '[cicy] =================================================='
    return 1
}

function __cicy_require_command() {
    local command_name="$1"
    local label="$2"
    local install_cmd="$3"
    local install_log="$4"
    if __cicy_refresh_command_path "$command_name"; then
        return 0
    fi
    if [ -z "$install_cmd" ]; then
        echo '[cicy] =================================================='
        echo "[cicy] ${label} 未找到，请更新基础镜像后重启"
        echo '[cicy] =================================================='
        return 1
    fi
    echo '[cicy] =================================================='
    echo "[cicy] ${label} 未安装，正在安装..."
    echo '[cicy] 可能需要 1-5 分钟，取决于网络速度'
    echo '[cicy] =================================================='
    mkdir -p "$(dirname "$install_log")" 2>/dev/null
    (
        bash -lc 'eval "$1"' -- "$install_cmd"
    ) >"$install_log" 2>&1 &
    local install_pid=$!
    local elapsed=0
    while kill -0 "$install_pid" 2>/dev/null; do
        elapsed=$((elapsed + 1))
        local filled=$(((elapsed % 20) + 1))
        local bar
        local pad
        bar=$(printf '%-*s' "$filled" '' | tr ' ' '#')
        pad=$(printf '%-*s' $((20 - filled)) '')
        printf '\r[cicy] [%s%s] 正在安装 %s... %3ss' "$bar" "$pad" "$label" "$elapsed"
        sleep 1
    done
    wait "$install_pid"
    local install_status=$?
    printf '\n'
    if [ "$install_status" -ne 0 ]; then
        echo "[cicy] ${label} 安装失败，最近日志："
        tail -100 "$install_log"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    if ! __cicy_refresh_command_path "$command_name"; then
        echo "[cicy] ${label} 安装完成，但当前 shell 仍找不到命令: $command_name"
        echo "[cicy] 当前 PATH: $PATH"
        if [ -f "$HOME/.opencode/bin/$command_name" ]; then
            echo "[cicy] 检测到安装产物: $HOME/.opencode/bin/$command_name"
        fi
        if [ -f "$HOME/.npm-global/bin/$command_name" ]; then
            echo "[cicy] 检测到安装产物: $HOME/.npm-global/bin/$command_name"
        fi
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    echo "[cicy] ${label} 安装完成"
}

function __cicy_require_command_live() {
    local command_name="$1"
    local label="$2"
    local install_cmd="$3"
    local install_log="$4"
    if __cicy_refresh_command_path "$command_name"; then
        return 0
    fi
    if [ -z "$install_cmd" ]; then
        echo '[cicy] =================================================='
        echo "[cicy] ${label} 未找到，请更新基础镜像后重启"
        echo '[cicy] =================================================='
        return 1
    fi
    mkdir -p "$(dirname "$install_log")"
    : >"$install_log"
    echo '[cicy] =================================================='
    echo "[cicy] ${label} 未安装，正在安装..."
    echo '[cicy] 正在显示实时下载进度，请稍候'
    echo '[cicy] =================================================='
    (
        set -o pipefail
        eval "$install_cmd" 2>&1 | tee "$install_log"
    )
    local install_status=$?
    if [ "$install_status" -ne 0 ]; then
        echo "[cicy] ${label} 安装失败，最近日志："
        tail -100 "$install_log"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    if ! __cicy_refresh_command_path "$command_name"; then
        echo "[cicy] ${label} 安装完成，但当前 shell 仍找不到命令: $command_name"
        echo "[cicy] 当前 PATH: $PATH"
        echo '[cicy] 手动重试: source boot.sh'
        return 1
    fi
    echo "[cicy] ${label} 安装完成"
}

function __cicy_kiro_checksum_from_manifest() {
    local manifest_path="$1"
    local filename="$2"
    if command -v jq >/dev/null 2>&1; then
        jq -r --arg name "$filename" '.packages[] | select(.download | endswith($name)) | .sha256 // empty' "$manifest_path"
        return 0
    fi
    python3 - "$manifest_path" "$filename" <<'PY'
import json
import sys

manifest_path, filename = sys.argv[1], sys.argv[2]
with open(manifest_path, "r", encoding="utf-8") as fh:
    data = json.load(fh)
for pkg in data.get("packages", []):
    download = str(pkg.get("download", ""))
    if download.endswith(filename):
        print(pkg.get("sha256", ""))
        break
PY
}

function __cicy_install_kiro_cli_with_progress() {
    local arch_raw arch suffix filename channel_base_url manifest_url download_url
    local download_dir manifest_path zip_path extract_dir install_script expected_checksum actual_checksum
    arch_raw="$(uname -m)"
    case "$arch_raw" in
        x86_64|amd64) arch="x86_64" ;;
        aarch64|arm64) arch="aarch64" ;;
        *)
            echo "[cicy] 不支持的 Kiro CLI 架构: $arch_raw"
            return 1
            ;;
    esac
    suffix=""
    if command -v ldd >/dev/null 2>&1; then
        if ldd --version 2>&1 | grep -qi musl || ldd /bin/ls 2>&1 | grep -qi musl; then
            suffix="-musl"
        fi
    fi
    filename="kirocli-${arch}-linux${suffix}.zip"
    channel_base_url="https://prod.download.cli.kiro.dev/stable"
    manifest_url="${channel_base_url}/latest/manifest.json"
    download_url="${channel_base_url}/latest/${filename}"
    download_dir="$(mktemp -d "${TMPDIR:-/tmp}/kiro-cli-install-XXXXXX")"
    manifest_path="$download_dir/manifest.json"
    zip_path="$download_dir/$filename"
    extract_dir="$download_dir/extract"
    echo "[cicy] 下载地址: $download_url"
    echo "[cicy] 获取校验清单..."
    curl -fsSL -o "$manifest_path" "$manifest_url"
    expected_checksum="$(__cicy_kiro_checksum_from_manifest "$manifest_path" "$filename" | tr -d '\r\n')"
    if [ -z "$expected_checksum" ]; then
        echo "[cicy] 未找到 Kiro CLI 校验和: $filename"
        rm -rf "$download_dir"
        return 1
    fi
    echo "[cicy] 开始下载 Kiro CLI 安装包..."
    curl -fL -o "$zip_path" "$download_url"
    actual_checksum="$(sha256sum "$zip_path" | awk '{print $1}')"
    if [ "$actual_checksum" != "$expected_checksum" ]; then
        echo "[cicy] Kiro CLI 校验失败"
        echo "[cicy] expected: $expected_checksum"
        echo "[cicy] actual:   $actual_checksum"
        rm -rf "$download_dir"
        return 1
    fi
    mkdir -p "$extract_dir"
    unzip -q "$zip_path" -d "$extract_dir"
    install_script="$extract_dir/kirocli/install.sh"
    if [ ! -f "$install_script" ]; then
        echo "[cicy] Kiro CLI 安装脚本不存在: $install_script"
        rm -rf "$download_dir"
        return 1
    fi
    chmod +x "$install_script"
    KIRO_CLI_SKIP_SETUP=1 "$install_script"
    rm -rf "$download_dir"
}

# 启用颜色
export TERM=xterm-256color

# Prompt: bash/zsh 分开设置，避免 zsh 直接打印 bash 的 PS1 转义串
if [ -n "${ZSH_VERSION:-}" ]; then
    autoload -Uz vcs_info 2>/dev/null || true
    zstyle ':vcs_info:*' enable git
    zstyle ':vcs_info:git:*' formats ' %F{208}(%b)%f'
    setopt PROMPT_SUBST
    function __cicy_update_zsh_prompt() {
        vcs_info >/dev/null 2>&1
        PROMPT='%1~${vcs_info_msg_0_} %F{cyan}$%f '
    }
    if [[ -z "${precmd_functions[(r)__cicy_update_zsh_prompt]}" ]]; then
        precmd_functions+=(__cicy_update_zsh_prompt)
    fi
    __cicy_update_zsh_prompt
elif [ -n "${BASH_VERSION:-}" ]; then
    # Self-contained git branch — works even when git's git-prompt.sh (__git_ps1)
    # isn't sourced. Prints " (branch)" only inside a git repo (short SHA when
    # detached), nothing otherwise. Replaces the old __git_ps1 path whose fallback
    # showed no branch at all (the `cicy-code $` you saw).
    __cicy_git_branch() {
        local b
        b=$(git symbolic-ref --short HEAD 2>/dev/null) ||
            b=$(git rev-parse --short HEAD 2>/dev/null) || return 0
        printf ' (%s)' "$b"
    }
    PS1='\W\[\033[38;5;208m\]$(__cicy_git_branch)\[\033[0m\] \[\033[01;36m\]$\[\033[0m\] '
fi

# ls 颜色
if ls --color=auto >/dev/null 2>&1; then
    alias ls='ls --color=auto'
    alias ll='ls -la --color=auto'
else
    alias ls='ls -G'
    alias ll='ls -laG'
fi

function __cicy_proxy_config_path() {
    printf '%s\n' "${CICY_PROXY_CONFIG:-$HOME/cicy-ai/proxy.json}"
}

function __cicy_proxy_have_jq() {
    command -v jq >/dev/null 2>&1
}

function __cicy_proxy_resolve_url() {
    local key="$1"
    local config
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        return 1
    fi
    jq -er --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .proxy_url' "$config"
}

function __cicy_proxy_env_url() {
    local proxy_url="$1"
    case "$proxy_url" in
        socks5://*)
            printf '%s\n' "http://${proxy_url#socks5://}"
            ;;
        *)
            printf '%s\n' "$proxy_url"
            ;;
    esac
}

function __cicy_proxy_exec_field() {
    local key="$1"
    local field="$2"
    local config cmd
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        echo "proxy: config not ready: $config"
        return 1
    fi
    cmd="$(jq -er --arg key "$key" --arg field "$field" '.ssh_proxies[] | select(.name == $key) | .[$field]' "$config")" || {
        echo "proxy: missing $field for $key"
        return 1
    }
    bash -lc "$cmd"
}

function __cicy_proxy_get_field() {
    local key="$1"
    local field="$2"
    local config
    config="$(__cicy_proxy_config_path)"
    if [ -z "$key" ] || ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        return 1
    fi
    jq -r --arg key "$key" --arg field "$field" '.ssh_proxies[] | select(.name == $key) | .[$field] // empty' "$config"
}

function __cicy_proxy_status_text() {
    local key="$1"
    local config local_port ssh_host ssh_host_name ssh_target
    config="$(__cicy_proxy_config_path)"
    if ! __cicy_proxy_have_jq || [ ! -f "$config" ]; then
        printf '%s\n' "-"
        return 0
    fi
    local_port="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .local_port // empty' "$config")"
    ssh_host="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .ssh_host // empty' "$config")"
    ssh_host_name="$(jq -r --arg key "$key" '.ssh_proxies[] | select(.name == $key) | .ssh_host_name // empty' "$config")"
    ssh_target="$ssh_host_name"
    if [ -z "$ssh_target" ]; then
        ssh_target="$ssh_host"
    fi
    if [ -n "$local_port" ] && [ -n "$ssh_target" ] && pgrep -af "ssh .* -D ([^ ]+:)?${local_port}([^0-9]|$).*(${ssh_target}|${ssh_host})" >/dev/null 2>&1; then
        printf '%s\n' "running"
        return 0
    fi
    printf '%s\n' "stopped"
}

function __cicy_proxy_find_ssh_pids() {
    local key="$1"
    local local_port ssh_host ssh_host_name ssh_target
    local_port="$(__cicy_proxy_get_field "$key" "local_port")"
    ssh_host="$(__cicy_proxy_get_field "$key" "ssh_host")"
    ssh_host_name="$(__cicy_proxy_get_field "$key" "ssh_host_name")"
    ssh_target="$ssh_host_name"
    if [ -z "$ssh_target" ]; then
        ssh_target="$ssh_host"
    fi
    if [ -z "$local_port" ] || [ -z "$ssh_target" ]; then
        return 1
    fi
    ps -eo pid=,args= | awk -v port="$local_port" -v host="$ssh_target" -v host2="$ssh_host" '
        {
            pid = $1
            $1 = ""
            args = substr($0, 2)
            if (args !~ /^ssh[[:space:]]/) {
                next
            }
            if (args !~ ("(^|[[:space:]])-D[[:space:]]+([^[:space:]]+:)?" port "([^0-9]|$)")) {
                next
            }
            if (index(args, host) || (host2 != "" && index(args, host2))) {
                print pid
            }
        }
    '
}

function __cicy_proxy_force_stop() {
    local key="$1"
    local pids=""
    local remaining=""
    pids="$(__cicy_proxy_find_ssh_pids "$key" | tr '\n' ' ')"
    if [ -z "${pids// }" ]; then
        return 1
    fi
    kill $pids 2>/dev/null || sudo -n kill $pids 2>/dev/null || true
    sleep 1
    remaining="$(__cicy_proxy_find_ssh_pids "$key" | tr '\n' ' ')"
    if [ -n "${remaining// }" ]; then
        kill -9 $remaining 2>/dev/null || sudo -n kill -9 $remaining 2>/dev/null || true
        sleep 1
    fi
    return 0
}

function __cicy_proxy_stop_profile() {
    local key="$1"
    local profile_status=""
    if [ -z "$key" ]; then
        echo "proxy: missing key"
        return 1
    fi
    profile_status="$(__cicy_proxy_status_text "$key")"
    if [ "$profile_status" != "running" ]; then
        echo "proxy: profile $key is $profile_status"
        return 0
    fi
    __cicy_proxy_exec_field "$key" "stop_cmd" >/dev/null 2>&1 || true
    __cicy_proxy_force_stop "$key" >/dev/null 2>&1 || true
    profile_status="$(__cicy_proxy_status_text "$key")"
    if [ "$profile_status" = "running" ]; then
        echo "proxy: failed to stop $key"
        return 1
    fi
    echo "proxy: stopped $key"
}

function __cicy_proxy_print_on_hint() {
    local key="$1"
    if [ -n "$key" ] && [[ "$key" != *"://"* ]]; then
        echo "请用 proxy on $key 开启代理"
    fi
}

function __cicy_proxy_auto_test() {
    local key="$1"
    if [ -z "$key" ] || [[ "$key" == *"://"* ]]; then
        return 0
    fi
    echo "proxy: testing $key"
    proxy test "$key"
}

function __cicy_var_is_set() {
    local name="$1"
    eval "[ \"\${${name}+x}\" = x ]"
}

function __cicy_var_get() {
    local name="$1"
    eval "printf '%s' \"\${${name}:-}\""
}

function __cicy_var_set() {
    local name="$1"
    local value="$2"
    if [ -n "${ZSH_VERSION:-}" ]; then
        typeset -g "$name=$value"
    elif [ -n "${BASH_VERSION:-}" ]; then
        printf -v "$name" '%s' "$value"
    else
        eval "$name=\$value"
    fi
    export "$name"
}

function __cicy_proxy_append_csv_unique() {
    local current="$1"
    local addition="$2"
    awk -v current="$current" -v addition="$addition" '
        function append_csv(csv,    n, arr, i, item) {
            n = split(csv, arr, ",")
            for (i = 1; i <= n; i++) {
                item = arr[i]
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", item)
                if (item == "" || seen[item]) {
                    continue
                }
                seen[item] = 1
                if (out != "") {
                    out = out "," item
                } else {
                    out = item
                }
            }
        }
        BEGIN {
            append_csv(current)
            append_csv(addition)
            print out
        }
    '
}

function __cicy_proxy_local_ips() {
    local out=""
    if command -v ipconfig >/dev/null 2>&1; then
        local ip
        for ip in \
            "$(ipconfig getifaddr en0 2>/dev/null)" \
            "$(ipconfig getifaddr en1 2>/dev/null)" \
            "$(ipconfig getifaddr en5 2>/dev/null)" \
            "$(ipconfig getifaddr en6 2>/dev/null)"; do
            case "$ip" in
                ""|127.*) ;;
                *) out="$(__cicy_proxy_append_csv_unique "$out" "$ip")" ;;
            esac
        done
    fi
    if [ -z "$out" ] && command -v hostname >/dev/null 2>&1; then
        local ip
        for ip in $(hostname -I 2>/dev/null); do
            case "$ip" in
                ""|127.*) ;;
                *) out="$(__cicy_proxy_append_csv_unique "$out" "$ip")" ;;
            esac
        done
    fi
    printf '%s\n' "$out"
}

function __cicy_proxy_default_no_proxy() {
    local defaults="localhost,127.0.0.1,::1,192.168.0.0/16"
    local local_ips
    local_ips="$(__cicy_proxy_local_ips)"
    printf '%s\n' "$(__cicy_proxy_append_csv_unique "$defaults" "$local_ips")"
}

function __cicy_proxy_save_current() {
    local name backup
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        backup="CICY_PROXY_SAVED_${name}"
        if __cicy_var_is_set "$backup"; then
            continue
        fi
        if __cicy_var_is_set "$name"; then
            __cicy_var_set "$backup" "$(__cicy_var_get "$name")"
        else
            __cicy_var_set "$backup" "__CICY_PROXY_UNSET__"
        fi
    done
}

function __cicy_proxy_restore_current() {
    local name backup saved
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        backup="CICY_PROXY_SAVED_${name}"
        if ! __cicy_var_is_set "$backup"; then
            unset "$name"
            continue
        fi
        saved="$(__cicy_var_get "$backup")"
        if [ "$saved" = "__CICY_PROXY_UNSET__" ]; then
            unset "$name"
        else
            __cicy_var_set "$name" "$saved"
        fi
        unset "$backup"
    done
}

function __cicy_proxy_list() {
    local name shown=0 env_value
    local config
    config="$(__cicy_proxy_config_path)"
    if __cicy_proxy_have_jq && [ -f "$config" ]; then
        echo "proxy profiles ($config)"
        while IFS=$'\t' read -r key scheme proxy_url; do
            [ -n "$key" ] || continue
            printf "  %-16s %-8s %-8s %s\n" "$key" "$scheme" "$(__cicy_proxy_status_text "$key")" "$proxy_url"
            shown=1
        done < <(jq -r '.ssh_proxies[] | [.name, (.scheme // ""), (.proxy_url // "")] | @tsv' "$config")
    fi
    if [ "$shown" -eq 0 ]; then
        echo "proxy profiles: none"
    fi
    echo "proxy env"
    shown=0
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        if __cicy_var_is_set "$name"; then
            env_value="$(__cicy_var_get "$name")"
            if [ -n "$env_value" ]; then
                printf "  %-12s %s\n" "$name" "$env_value"
                shown=1
            fi
        fi
    done
    if [ -n "${CICY_PROXY_URL:-}" ]; then
        printf "  %-12s %s\n" "CICY_PROXY_URL" "$CICY_PROXY_URL"
        shown=1
    fi
    if [ -n "${CICY_PROXY_KEY:-}" ]; then
        printf "  %-12s %s\n" "CICY_PROXY_KEY" "$CICY_PROXY_KEY"
        shown=1
    fi
    if [ "$shown" -eq 0 ]; then
        echo "  no active proxy env vars"
    fi
}

function __cicy_proxy_print_selected() {
    local key_or_url="$1"
    local proxy_env_url="$2"
    local profile_status="$3"
    echo "proxy: enabled $proxy_env_url"
    if [ -n "$key_or_url" ] && [[ "$key_or_url" != *"://"* ]]; then
        echo "proxy: profile $key_or_url $profile_status"
        return 0
    fi
    echo "proxy: target $proxy_env_url"
}

function proxy_ssh() {
    local cli="$HOME/projects/cicy-code/skills/proxy_ssh"
    if [ -x "$cli" ]; then
        "$cli" "$@"
        return $?
    fi
    if command -v proxy_ssh >/dev/null 2>&1; then
        command proxy_ssh "$@"
        return $?
    fi
    echo "proxy_ssh: command not found: $cli"
    return 1
}

function __cicy_global_proxy_token() {
    local global_json="${CICY_GLOBAL_JSON:-$HOME/cicy-ai/global.json}"
    if ! command -v jq >/dev/null 2>&1; then
        echo "cicy_proxy: jq not found" >&2
        return 1
    fi
    if [ ! -f "$global_json" ]; then
        echo "cicy_proxy: global config not found: $global_json" >&2
        return 1
    fi
    jq -er '.proxy_token // empty' "$global_json" 2>/dev/null
}

function __cicy_proxy_agent_user() {
    if [ -n "${X_AGENT_SHORT_ID:-}" ]; then
        printf '%s\n' "$X_AGENT_SHORT_ID"
        return 0
    fi
    if [ -n "${CICY_WORKER_ID:-}" ]; then
        printf '%s\n' "$CICY_WORKER_ID"
        return 0
    fi
    case "$PWD" in
        */workers/w-*)
            printf '%s\n' "$(printf '%s' "$PWD" | sed -n 's#.*\/workers\/\(w-[^/]*\).*#\1#p')"
            return 0
            ;;
    esac
    printf '%s\n' "w-1001"
}

function __cicy_proxy_agent_url() {
    local user token
    user="$(__cicy_proxy_agent_user)" || return 1
    token="$(__cicy_global_proxy_token)" || {
        echo "cicy_proxy: proxy_token missing in global.json" >&2
        return 1
    }
    printf 'http://%s:%s@127.0.0.1:9001\n' "$user" "$token"
}

function cicy_proxy_on() {
    local proxy_url merged_no_proxy
    proxy_url="$(__cicy_proxy_agent_url)" || return 1
    merged_no_proxy="$(__cicy_proxy_append_csv_unique "${NO_PROXY:-${no_proxy:-}}" "$(__cicy_proxy_default_no_proxy)")"
    export CICY_PROXY_URL="$proxy_url"
    export HTTP_PROXY="$proxy_url"
    export HTTPS_PROXY="$proxy_url"
    export ALL_PROXY="$proxy_url"
    export http_proxy="$proxy_url"
    export https_proxy="$proxy_url"
    export all_proxy="$proxy_url"
    export NO_PROXY="$merged_no_proxy"
    export no_proxy="$merged_no_proxy"
    echo "enabled"
}

function cicy_proxy_off() {
    unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy CICY_PROXY_KEY CICY_PROXY_URL
}

function __cicy_mihomo_config_path() {
    printf '%s\n' "${CICY_MIHOMO_CONFIG:-$HOME/cicy-ai/db/mihomo.yaml}"
}

function __cicy_mihomo_has_in_user_rule() {
    # Accept either:
    #   1. an exact IN-USER,<user>,...  rule
    #   2. an IN-USER-PREFIX,<prefix1>[/<prefix2>...],...  rule where <user>
    #      HasPrefix one of the listed prefixes (mihomo v1.10.2+, cicy-ai fork)
    local user config prefix prefixes line
    user="$(__cicy_proxy_agent_user)" || return 1
    config="$(__cicy_mihomo_config_path)"
    if [ ! -f "$config" ]; then
        echo "cicy_proxy: mihomo config not found: $config"
        return 1
    fi
    # exact match first
    if grep -E "^[[:space:]]*-[[:space:]]*IN-USER,${user}," "$config" >/dev/null 2>&1; then
        return 0
    fi
    # prefix match: extract every IN-USER-PREFIX rule's prefix list and check
    while IFS= read -r line; do
        prefixes="$(printf '%s' "$line" | sed -E 's/^[[:space:]]*-[[:space:]]*IN-USER-PREFIX,([^,]+),.*/\1/')"
        IFS='/' read -ra prefix <<< "$prefixes"
        for p in "${prefix[@]}"; do
            case "$user" in
                "$p"*) return 0 ;;
            esac
        done
    done < <(grep -E "^[[:space:]]*-[[:space:]]*IN-USER-PREFIX," "$config")
    return 1
}

function cicy_proxy_test() {
    local target output _status elapsed_ms user
    user="$(__cicy_proxy_agent_user)" || return 1
    if ! __cicy_mihomo_has_in_user_rule; then
        echo "cicy_proxy: mihomo.yaml has no IN-USER rule for ${user}"
        return 1
    fi
    target="${1:-https://api.myip.com}"
    output="$(curl -sS -w '\n__CICY_TIME_TOTAL__=%{time_total}' --max-time 20 --connect-timeout 8 "$target")"
    _status=$?
    elapsed_ms="$(printf '%s\n' "$output" | sed -n 's/^__CICY_TIME_TOTAL__=//p' | tail -n1 | awk '{printf "%d", ($1 * 1000)}')"
    output="$(printf '%s\n' "$output" | sed '/^__CICY_TIME_TOTAL__=/d')"
    if [ "$_status" -ne 0 ]; then
        if [ -n "$output" ]; then
            printf '%s\n' "$output"
        fi
        if [ -n "$elapsed_ms" ]; then
            printf 'elapsed_ms: %s\n' "$elapsed_ms"
        fi
        return "$_status"
    fi
    if command -v jq >/dev/null 2>&1 && printf '%s' "$output" | jq -e . >/dev/null 2>&1; then
        printf '%s' "$output" | jq .
    else
        printf '%s\n' "$output"
    fi
    if [ -n "$elapsed_ms" ]; then
        printf 'elapsed_ms: %s\n' "$elapsed_ms"
    fi
}

function __cicy_public_ip() {
    env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u NO_PROXY -u no_proxy \
        curl -sS --max-time 10 --connect-timeout 5 ifconfig.me 2>/dev/null | tr -d '\r\n'
}

function cicy_proxy_show() {
    local name value shown=0 replace_with public_ip ips ip i sel count
    replace_with="${1:-}"
    if [ "$replace_with" = "1" ]; then
        public_ip="$(__cicy_public_ip)"
    elif [ "$replace_with" = "0" ]; then
        ips="$(ifconfig 2>/dev/null | grep 'inet ' | grep -v 127.0.0.1 | awk '{print $2}' | sort -u)"
        count=0
        for ip in $ips; do count=$((count+1)); done
        if [ "$count" -eq 0 ]; then
            echo "cicy_proxy: no LAN IP found"
            return 1
        fi
        echo "Select LAN IP:"
        i=0
        for ip in $ips; do
            i=$((i+1))
            echo "  $i. $ip"
        done
        while true; do
            printf "Enter number (1-%s): " "$count"
            read -r sel
            i=0
            for ip in $ips; do
                i=$((i+1))
                if [ "$sel" = "$i" ]; then
                    public_ip="$ip"
                    break 2
                fi
            done
        done
    fi
    for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy; do
        if __cicy_var_is_set "$name"; then
            value="$(__cicy_var_get "$name")"
            if [ -n "$value" ]; then
                if [ -n "$public_ip" ]; then
                    value="${value//127.0.0.1/$public_ip}"
                fi
                printf 'export %s="%s"\n' "$name" "$value"
                shown=1
            fi
        fi
    done
    if [ "$shown" -eq 0 ]; then
        echo "cicy_proxy: no proxy env exported"
    fi
}

# ── Global mihomo proxy (all tmux shells) ────────────────────────────────
# Route every shell through the local mihomo mixed port, ANONYMOUSLY: 127.0.0.1
# is in mihomo's skip-auth-prefixes, so no user/token is needed. mihomo's
# default_proxy_group decides the real egress — DIRECT by default (traffic
# exits the box's own IP), or a real node when the group is switched inside
# mihomo.yaml (via the cicy-mihomo skill). i.e. the env ALWAYS points at
# mihomo; the on/off (direct vs node) switch lives in mihomo.yaml, not here.
#
# Contrast with the per-agent proxy (cicy_proxy_on): that uses
# w-<id>:<token>@9001 so mihomo can apply IN-USER routing per agent. The global
# one is anonymous. Per-agent / MITM exports run later (at agent launch) and
# override these for that process.
function __cicy_global_proxy_url() { printf '%s\n' "${CICY_GLOBAL_PROXY_URL:-http://127.0.0.1:9001}"; }

# Fast localhost reachability probe (refused == immediate, no hang/timeout
# needed for 127.0.0.1). Used to FAIL OPEN: if mihomo isn't up, leave the shell
# on a direct connection instead of pointing every command at a dead port.
#
# Bug fix(*not optional*): the subshell `(exec 3<>... )` opens fd 3 ONLY in the
# subshell, and the fd auto-closes when the subshell exits — no cleanup needed.
# A previous version had `... && exec 3>&- 2>/dev/null` as a "close fd 3" trailer.
# In bash, `exec` with redirections but NO command applies those redirections to
# the CURRENT shell permanently. The `2>/dev/null` there silently rerouted bash's
# stderr — which is where PS1 prompts are written — to /dev/null. Result: any
# interactive bash that hit this branch (mihomo reachable) printed PS1 to a black
# hole, tmux pane stayed blank, cicy-code's 20s prompt-detection timed out, and
# claude/opencode never started. Symptom: "all panes are black, agents won't
# come up" — exactly what hit ton@mac on 2026-05-29 between 2.1.8 → 2.1.9.
function __cicy_mihomo_reachable() { (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; }

function cicy_global_proxy_on() {
    local url merged_no_proxy
    url="$(__cicy_global_proxy_url)"
    merged_no_proxy="$(__cicy_proxy_append_csv_unique "${NO_PROXY:-${no_proxy:-}}" "$(__cicy_proxy_default_no_proxy)")"
    export HTTP_PROXY="$url" HTTPS_PROXY="$url" ALL_PROXY="$url"
    export http_proxy="$url" https_proxy="$url" all_proxy="$url"
    export NO_PROXY="$merged_no_proxy" no_proxy="$merged_no_proxy"
}

function cicy_global_proxy_off() {
    unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy NO_PROXY no_proxy
}

# Auto-apply once per shell. Default ON (CICY_GLOBAL_PROXY_ENABLED=0 opts out).
# Skip when a proxy is already set (per-agent / MITM / user override) so we
# never clobber a more specific choice, and only when mihomo is actually up.
if [ "${CICY_GLOBAL_PROXY_ENABLED:-1}" = "1" ] && [ -z "${CICY_GLOBAL_PROXY_DONE:-}" ]; then
    export CICY_GLOBAL_PROXY_DONE=1
    if [ -z "${CICY_PROXY_URL:-}" ] && ! __cicy_var_is_set HTTP_PROXY && __cicy_mihomo_reachable; then
        cicy_global_proxy_on
    fi
fi
