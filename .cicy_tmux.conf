echo "cicy tmux inited!!"
export CICY_TMUX=1
export CICY_VERSION="1.0.7"

# 启用颜色
export TERM=xterm-256color

# PS1: 按 bash 原生转义显示最后一级目录，不显示用户名
PS1='\[\033[01;34m\]\W\[\033[0m\]\[\033[38;5;208m\]$(__git_ps1 " (%s)")\[\033[0m\] \[\033[01;36m\]$\[\033[0m\] '

# 如果没有 git-prompt，使用简化版
if ! type __git_ps1 >/dev/null 2>&1; then
    PS1='\[\033[01;34m\]\W\[\033[0m\] \[\033[01;36m\]$\[\033[0m\] '
fi

# ls 颜色
alias ls='ls --color=auto'
alias ll='ls -la --color=auto'
