[program:cicy-code-dev]
command=/bin/bash -lc 'cd /home/w3c_offical/projects/cicy-code-v1 && exec python3 dev.py'
directory=/home/w3c_offical/projects/cicy-code-v1
environment=HOME="/home/w3c_offical",TERM="xterm-256color",PORT="8021",SQLITE_PATH="/home/w3c_offical/.cicy/data-v1.db"
user=w3c_offical
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/home/w3c_offical/.cicy/logs/cicy-code-dev-supervisor.log
stderr_logfile=/home/w3c_offical/.cicy/logs/cicy-code-dev-supervisor.log
