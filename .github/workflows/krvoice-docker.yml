# 构建 KrVoiceAI 的 docker 镜像并推 docker.io(cicybot/krvoice-gpu, cicybot/krvoice-compose)
# 放在 cicy-code 仓库:复用本仓库的 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets
name: krvoice-docker
on:
  workflow_dispatch:
    inputs:
      target:
        description: "build target: gpu / compose / all"
        default: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (GPU 镜像很大)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout KrVoiceAI
        uses: actions/checkout@v4
        with:
          repository: cicy-ai/KrVoiceAI
          ref: main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push compose (CPU 编排层)
        if: ${{ inputs.target == 'all' || inputs.target == 'compose' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.compose
          push: true
          tags: |
            cicybot/krvoice-compose:latest

      - name: Build & push gpu (CosyVoice+LatentSync)
        if: ${{ inputs.target == 'all' || inputs.target == 'gpu' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: |
            cicybot/krvoice-gpu:latest

      - name: Image sizes
        run: docker images | head -5 || true
