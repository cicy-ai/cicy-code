name: Compatibility

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  linux-go-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:12
            package_manager: apt
          - distro: ubuntu:24.04
            package_manager: apt
          - distro: alpine:3.20
            package_manager: apk
          - distro: rockylinux:9
            package_manager: dnf
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install base tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl git jq unzip tmux sudo python3 nodejs npm golang
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash curl git jq unzip tmux sudo python3 nodejs npm go
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git jq unzip tmux sudo python3 nodejs npm golang curl which findutils
          else
            echo "unsupported package manager"
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Run mgr unit tests for distro profile
        env:
          CICY_TEST_PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: ./build.sh test-go ./mgr/...

  linux-docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run mgr unit tests
        run: ./build.sh test-go ./mgr/...

      - name: Build Linux binary
        run: ./build.sh build linux amd64

      - name: Validate runtime smoke flow on current Docker path
        run: python3 dev.py --docker --port 8026 --name compatibility-${{ github.run_id }}

  macos-matrix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tmux
        run: brew install tmux

      - name: Run mgr unit tests
        env:
          CICY_TEST_PACKAGE_MANAGER: brew
        run: ./build.sh test-go ./mgr/...

      - name: Build Darwin binary
        run: ./build.sh build darwin arm64
