name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: "Manual release — bump npm/package.json by this amount, then tag + build + publish."
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version & tag
        id: meta
        # Two entry points:
        #   • push tag v* → version is taken FROM the tag (the classic flow; the
        #     bump was done locally before `git push --tags`).
        #   • workflow_dispatch → this is the one-click "手动发版": read the current
        #     npm/package.json version and bump patch/minor/major to get the next one.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CUR=$(python3 -c "import json;print(json.load(open('npm/package.json'))['version'])")
            IFS=. read -r MA MI PA <<< "$CUR"
            case "${{ github.event.inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0;;
              minor) MI=$((MI+1)); PA=0;;
              *)     PA=$((PA+1));;
            esac
            VERSION="$MA.$MI.$PA"
            echo "Manual release: $CUR -> $VERSION (${{ github.event.inputs.bump }})"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Tag-push release: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch version strings
        # sync-version.py (run inside build.sh all) reads npm/package.json and
        # propagates the version to app/src/config.ts and api/mgr/main.go. We only
        # need to set npm/package.json (+ the per-platform optionalDependencies so
        # the launcher and its 4 binary sub-packages publish at the same version)
        # and app/package.json here; the build does the rest.
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          python3 -c "
          import json, sys
          p = json.load(open('npm/package.json'))
          p['version'] = sys.argv[1]
          for k in list(p.get('optionalDependencies', {})):
              p['optionalDependencies'][k] = sys.argv[1]
          json.dump(p, open('npm/package.json','w'), indent=2)
          print('npm/package.json version:', p['version'], '| optionalDeps ->', sys.argv[1])
          " "$VERSION"
          python3 -c "
          import json, sys
          p = json.load(open('app/package.json'))
          p['version'] = sys.argv[1]
          json.dump(p, open('app/package.json','w'), indent=2)
          " "$VERSION"
          echo "Version patched to ${VERSION}"

      - name: Commit version bump (manual release only)
        # For workflow_dispatch we bumped npm/package.json in-CI — commit it back to
        # the branch so main reflects the released version and the NEXT manual bump
        # starts from the right base. (Tag-push releases already carry the bump.)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add npm/package.json app/package.json
          git commit -m "chore(release): v${{ steps.meta.outputs.version }}" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build all platform binaries
        # bash build.sh all runs prepare_embed (builds the cicy-skills tarball that
        # //go:embed picks up + the frontend + ttyd assets) then cross-compiles
        # darwin/linux amd64+arm64.
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Verify frontend version was rebuilt
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          node - "$VERSION" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const expected = process.argv[2];
          const dir = path.join('app', 'dist', 'assets');
          const bundles = fs.readdirSync(dir).filter((name) => name.endsWith('.js'));
          const found = bundles.some((name) => fs.readFileSync(path.join(dir, name), 'utf8').includes(`version="${expected}"`));
          if (!found) {
            console.error(`frontend bundle does not contain release version ${expected}; refusing to publish stale app/dist`);
            process.exit(1);
          }
          console.log(`frontend bundle verified: ${expected}`);
          NODE

      - name: Generate release manifest
        # manifest.json is the canonical source the cicy-desktop installer reads to
        # discover the latest version + binary URLs. Hosted as a release asset so
        # it's CN-reachable and /releases/latest/download/manifest.json resolves.
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          for f in \
            dist/cicy-code-darwin-amd64 \
            dist/cicy-code-darwin-arm64 \
            dist/cicy-code-linux-amd64 \
            dist/cicy-code-linux-arm64; do
            if [ ! -s "$f" ]; then
              echo "Missing release artifact: $f" >&2
              exit 1
            fi
          done
          cat > dist/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "darwin-amd64":  "${BASE}/cicy-code-darwin-amd64",
              "darwin-arm64":  "${BASE}/cicy-code-darwin-arm64",
              "linux-amd64":   "${BASE}/cicy-code-linux-amd64",
              "linux-arm64":   "${BASE}/cicy-code-linux-arm64"
            },
            "sizes": {
              "darwin-amd64":  $(stat -c%s dist/cicy-code-darwin-amd64),
              "darwin-arm64":  $(stat -c%s dist/cicy-code-darwin-arm64),
              "linux-amd64":   $(stat -c%s dist/cicy-code-linux-amd64),
              "linux-arm64":   $(stat -c%s dist/cicy-code-linux-arm64)
            }
          }
          EOF
          cat dist/manifest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Create the tag on the current commit if it doesn't exist (manual
          # release path) so the release has something to attach to.
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          for f in \
            dist/cicy-code-darwin-amd64 \
            dist/cicy-code-darwin-arm64 \
            dist/cicy-code-linux-amd64 \
            dist/cicy-code-linux-arm64 \
            dist/manifest.json; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish to npm (4 packages + CN sync)
        # Runs for BOTH tag-push and manual (workflow_dispatch) releases — a 手动发版
        # is a real release and should hit npm too. publish-all.sh publishes the
        # launcher + the four per-platform binary sub-packages (reusing dist/ via
        # --from) then triggers the npmmirror (CN) cache sync.
        #
        # secrets.NPM_TOKEN must be a Granular Access Token with "Bypass 2FA".
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          bash publish-all.sh "${{ steps.meta.outputs.version }}" --from ../dist

      - name: Upload bootstrap installer to R2
        # Keep the one-liner installer (curl -fsSL https://r2.deepfetch.de5.net/code | sh)
        # in sync with each release.
        #   vars.R2_ACCOUNT_ID    Cloudflare account id
        #   secrets.R2_API_TOKEN  CF API token with R2 object-write on cicy-assets-poc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
        run: |
          npx --yes wrangler@3.114.17 r2 object put \
            cicy-assets-poc/code \
            --file=npm/install.sh \
            --content-type=text/x-shellscript
          echo "Uploaded npm/install.sh -> https://r2.deepfetch.de5.net/code"
