name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.2). Created on the current commit if it does not exist."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build all platform binaries
        # bash build.sh all runs prepare_embed (builds the cicy-skills tarball
        # that //go:embed picks up + builds the frontend + ttyd assets) and
        # then cross-compiles darwin/linux amd64+arm64. Without prepare_embed
        # the go:embed pattern for cicy_skills_assets.tar.gz fails at compile
        # time — that was the latent bug the previous release step shipped
        # with (cross-compile invoked go build directly with no embed prep).
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        # manifest.json is the canonical source the cicy-desktop installer
        # reads to discover the latest version + binary URLs. Hosted as a
        # release asset so:
        #   1. It's CN-reachable via ghproxy mirrors (same path as binaries).
        #   2. GitHub's /releases/latest/download/manifest.json redirects to
        #      whatever release was tagged "latest" — clients don't need to
        #      walk git tags.
        # Also pinned at the v<TAG> URL for clients that want a specific ver.
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > dist/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "darwin-amd64": "${BASE}/cicy-code-darwin-amd64",
              "darwin-arm64": "${BASE}/cicy-code-darwin-arm64",
              "linux-amd64":  "${BASE}/cicy-code-linux-amd64",
              "linux-arm64":  "${BASE}/cicy-code-linux-arm64"
            },
            "sizes": {
              "darwin-amd64": $(stat -c%s dist/cicy-code-darwin-amd64),
              "darwin-arm64": $(stat -c%s dist/cicy-code-darwin-arm64),
              "linux-amd64":  $(stat -c%s dist/cicy-code-linux-amd64),
              "linux-arm64":  $(stat -c%s dist/cicy-code-linux-arm64)
            }
          }
          EOF
          cat dist/manifest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # For workflow_dispatch, create the tag on the current commit if it
          # does not exist so the release has something to attach to.
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Step 1: ensure release exists (no assets — keep this command simple).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Step 2: upload each asset individually so a failure on one (e.g.
          # manifest.json) is visible. --clobber overwrites a prior upload of
          # the same asset name.
          for f in \
            dist/cicy-code-darwin-amd64 \
            dist/cicy-code-darwin-arm64 \
            dist/cicy-code-linux-amd64 \
            dist/cicy-code-linux-arm64 \
            dist/manifest.json; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish to npm
        # Only publish on real tag pushes — workflow_dispatch snapshots stay
        # GitHub-release-only to avoid burning npm version numbers.
        if: github.event_name == 'push'
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
