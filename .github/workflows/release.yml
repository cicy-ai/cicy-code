name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.2). Created on the current commit if it does not exist."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Patch version strings
        # sync-version.py reads npm/package.json and propagates the version to
        # app/src/config.ts and api/mgr/main.go. We just bump npm/package.json
        # and let the script do the rest (it runs via build.sh all → sync_version).
        run: |
          RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          # Patch npm/package.json — sync-version.py reads this as the source of
          # truth. Also lockstep the per-platform optionalDependencies to the
          # release version so the main launcher and its 4 binary sub-packages
          # all publish at the same version (publish-all.sh builds the subs).
          python3 -c "
          import json, sys
          p = json.load(open('npm/package.json'))
          p['version'] = sys.argv[1]
          for k in list(p.get('optionalDependencies', {})):
              p['optionalDependencies'][k] = sys.argv[1]
          json.dump(p, open('npm/package.json','w'), indent=2)
          print('npm/package.json version:', p['version'], '| optionalDeps ->', sys.argv[1])
          " "$VERSION"
          # Also patch app/package.json for consistency
          python3 -c "
          import json, sys
          p = json.load(open('app/package.json'))
          p['version'] = sys.argv[1]
          json.dump(p, open('app/package.json','w'), indent=2)
          " "$VERSION"
          echo "Version patched to ${VERSION}"

      - name: Build all platform binaries
        # bash build.sh all runs prepare_embed (builds the cicy-skills tarball
        # that //go:embed picks up + builds the frontend + ttyd assets) and
        # then cross-compiles darwin/linux amd64+arm64. Without prepare_embed
        # the go:embed pattern for cicy_skills_assets.tar.gz fails at compile
        # time — that was the latent bug the previous release step shipped
        # with (cross-compile invoked go build directly with no embed prep).
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Docker images ─────────────────────────────────────────────────
      # Push to Docker Hub. CN users pull through any of the public
      # dockerhub mirrors (dockerproxy.com, daocloud, etc) — pulls in MM/CN
      # are 30-60s vs 5+ min from ghcr.io.
      #
      # Required:
      #   vars.DOCKERHUB_USERNAME    e.g. cicybot
      #   secrets.DOCKERHUB_TOKEN    PAT from hub.docker.com → Security
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push cicy-code-base
        env:
          BASE_TAG: 1.0.9
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -e
          docker build -f api/Dockerfile.runtime.base \
            -t cicy-code-base:${BASE_TAG} \
            api/
          for tag in ${BASE_TAG} latest; do
            docker tag cicy-code-base:${BASE_TAG} docker.io/$DOCKERHUB_USERNAME/cicy-code-base:$tag
            docker push docker.io/$DOCKERHUB_USERNAME/cicy-code-base:$tag
          done

      - name: Build & push cicy-code (runtime)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BASE_TAG: 1.0.9
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -e
          cp dist/cicy-code-linux-amd64 api/cicy-code-docker
          docker build -f api/Dockerfile.runtime \
            --build-arg BASE_IMAGE=docker.io/$DOCKERHUB_USERNAME/cicy-code-base:${BASE_TAG} \
            -t cicy-code:${VERSION} \
            api/
          rm -f api/cicy-code-docker
          for tag in ${VERSION} latest; do
            docker tag cicy-code:${VERSION} docker.io/$DOCKERHUB_USERNAME/cicy-code:$tag
            docker push docker.io/$DOCKERHUB_USERNAME/cicy-code:$tag
          done

      - name: Generate release manifest
        # manifest.json is the canonical source the cicy-desktop installer
        # reads to discover the latest version + binary URLs. Hosted as a
        # release asset so:
        #   1. It's CN-reachable via ghproxy mirrors (same path as binaries).
        #   2. GitHub's /releases/latest/download/manifest.json redirects to
        #      whatever release was tagged "latest" — clients don't need to
        #      walk git tags.
        # Also pinned at the v<TAG> URL for clients that want a specific ver.
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > dist/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "darwin-amd64": "${BASE}/cicy-code-darwin-amd64",
              "darwin-arm64": "${BASE}/cicy-code-darwin-arm64",
              "linux-amd64":  "${BASE}/cicy-code-linux-amd64",
              "linux-arm64":  "${BASE}/cicy-code-linux-arm64"
            },
            "sizes": {
              "darwin-amd64": $(stat -c%s dist/cicy-code-darwin-amd64),
              "darwin-arm64": $(stat -c%s dist/cicy-code-darwin-arm64),
              "linux-amd64":  $(stat -c%s dist/cicy-code-linux-amd64),
              "linux-arm64":  $(stat -c%s dist/cicy-code-linux-arm64)
            }
          }
          EOF
          cat dist/manifest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # For workflow_dispatch, create the tag on the current commit if it
          # does not exist so the release has something to attach to.
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Step 1: ensure release exists (no assets — keep this command simple).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Step 2: upload each asset individually so a failure on one (e.g.
          # manifest.json) is visible. --clobber overwrites a prior upload of
          # the same asset name.
          for f in \
            dist/cicy-code-darwin-amd64 \
            dist/cicy-code-darwin-arm64 \
            dist/cicy-code-linux-amd64 \
            dist/cicy-code-linux-arm64 \
            dist/manifest.json; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish to npm (5 packages + CN sync)
        # Only publish on real tag pushes — workflow_dispatch snapshots stay
        # GitHub-release-only to avoid burning npm version numbers.
        #
        # publish-all.sh publishes the main launcher + the four per-platform
        # binary sub-packages (cicy-code-{darwin,linux}-{arm64,x64}, esbuild-
        # style optionalDependencies), reusing the binaries already built in
        # dist/ (--from), then auto-triggers the npmmirror (CN) cache sync for
        # each so CN users resolve the new version without lag.
        #
        # secrets.NPM_TOKEN must be a Granular Access Token with "Bypass 2FA"
        # enabled (classic automation tokens 403 against cicybot's 2FA policy).
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          bash publish-all.sh "${{ steps.tag.outputs.version }}" --from ../dist

      - name: Upload bootstrap installer to R2
        # Keep the one-liner installer (curl -fsSL https://r2.deepfetch.de5.net/code | sh)
        # in sync with each release: upload npm/install.sh to the R2 bucket
        # under key "code" via wrangler — the same command the cicy-r2 CLI runs
        # locally (`wrangler r2 object put <bucket>/<key> --file <f>`), with the
        # account/token in env. R2 is the CN-friendly host (no ICP filter, CF
        # edge cache, no arrears freeze like COS).
        #
        # Required:
        #   vars.R2_ACCOUNT_ID    Cloudflare account id (3cd74d293cda341378bb80ea52ff247d)
        #   secrets.R2_API_TOKEN  CF API token with R2 object-write on cicy-assets-poc
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
        run: |
          npx --yes wrangler@3.114.17 r2 object put \
            cicy-assets-poc/code \
            --file=npm/install.sh \
            --content-type=text/x-shellscript
          echo "Uploaded npm/install.sh -> https://r2.deepfetch.de5.net/code"

      - name: Upload App SPA to per-release R2 dir (for --cdn)
        # Publish app/dist to /app/v<version>/ so `cicy-code --cdn` serves this
        # exact release's bundles from R2. Each release uses its own path
        # (build.sh bakes /app/v<version>), so the upload is never cache-
        # poisoned by a prior version and there is no hash collision. Per-file
        # Content-Type is set (R2 mis-tags .svg as application/xml otherwise →
        # Chrome ORB blocks). The default binary is self-contained and ignores
        # this; only --cdn deployments use it.
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
        run: |
          bash npm/upload-cdn.sh "${{ steps.tag.outputs.version }}" app/dist
