name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.2). Created on the current commit if it does not exist."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build all platform binaries
        # bash build.sh all runs prepare_embed (builds the cicy-skills tarball
        # that //go:embed picks up + builds the frontend + ttyd assets) and
        # then cross-compiles darwin/linux amd64+arm64. Without prepare_embed
        # the go:embed pattern for cicy_skills_assets.tar.gz fails at compile
        # time — that was the latent bug the previous release step shipped
        # with (cross-compile invoked go build directly with no embed prep).
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # For workflow_dispatch, create the tag on the current commit if it
          # does not exist so the release has something to attach to.
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # If a release already exists for this tag, upload (clobbering
          # same-named assets). Otherwise create it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/cicy-code-darwin-amd64 \
              dist/cicy-code-darwin-arm64 \
              dist/cicy-code-linux-amd64 \
              dist/cicy-code-linux-arm64 \
              --clobber
          else
            gh release create "$TAG" \
              dist/cicy-code-darwin-amd64 \
              dist/cicy-code-darwin-arm64 \
              dist/cicy-code-linux-amd64 \
              dist/cicy-code-linux-arm64 \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Publish to npm
        # Only publish on real tag pushes — workflow_dispatch snapshots stay
        # GitHub-release-only to avoid burning npm version numbers.
        if: github.event_name == 'push'
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
