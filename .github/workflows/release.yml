name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.2). Created on the current commit if it does not exist."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Patch version strings
        # sync-version.py reads npm/package.json and propagates the version to
        # app/src/config.ts and api/mgr/main.go. We just bump npm/package.json
        # and let the script do the rest (it runs via build.sh all → sync_version).
        run: |
          RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW#v}"
          # Patch npm/package.json — sync-version.py reads this as the source of truth
          python3 -c "
          import json, sys
          p = json.load(open('npm/package.json'))
          p['version'] = sys.argv[1]
          json.dump(p, open('npm/package.json','w'), indent=2)
          print('npm/package.json version:', p['version'])
          " "$VERSION"
          # Also patch app/package.json for consistency
          python3 -c "
          import json, sys
          p = json.load(open('app/package.json'))
          p['version'] = sys.argv[1]
          json.dump(p, open('app/package.json','w'), indent=2)
          " "$VERSION"
          echo "Version patched to ${VERSION}"

      - name: Build all platform binaries
        # bash build.sh all runs prepare_embed (builds the cicy-skills tarball
        # that //go:embed picks up + builds the frontend + ttyd assets) and
        # then cross-compiles darwin/linux amd64+arm64. Without prepare_embed
        # the go:embed pattern for cicy_skills_assets.tar.gz fails at compile
        # time — that was the latent bug the previous release step shipped
        # with (cross-compile invoked go build directly with no embed prep).
        run: |
          bash build.sh all
          ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Docker images ─────────────────────────────────────────────────
      # Two registries:
      #   ghcr.io/cicy-ai/...                (global users)
      #   <ALIYUN_REGISTRY>/<NS>/...         (CN users, much faster)
      #
      # The ACR step is conditional on the secrets existing — without ACR
      # creds we still publish to ghcr only. ACR creds:
      #   ALIYUN_REGISTRY            e.g. registry.cn-hangzhou.aliyuncs.com
      #   ALIYUN_REGISTRY_NAMESPACE  e.g. cicy-ai
      #   ALIYUN_REGISTRY_USERNAME   ACR docker login user (NOT access key)
      #   ALIYUN_REGISTRY_PASSWORD   ACR docker login password
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: ${{ vars.ALIYUN_REGISTRY != '' || secrets.ALIYUN_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build & push cicy-code-base
        # The base image (debian + node24 + apt cli tools + cloudflared) is
        # rebuilt every release. Layer cache keeps subsequent builds fast;
        # if Dockerfile.runtime.base is unchanged, push only re-stamps the
        # tag and uploads zero layers.
        env:
          BASE_TAG: 1.0.9
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
          ALIYUN_NS: ${{ vars.ALIYUN_REGISTRY_NAMESPACE || secrets.ALIYUN_REGISTRY_NAMESPACE || 'cicy-ai' }}
        run: |
          set -e
          # We don't use docker/build-push-action because we want to mirror
          # the same image to two registries with conditional ACR push.
          docker build -f api/Dockerfile.runtime.base \
            -t cicy-code-base:${BASE_TAG} \
            api/
          for tag in ${BASE_TAG} latest; do
            docker tag cicy-code-base:${BASE_TAG} ghcr.io/${{ github.repository_owner }}/cicy-code-base:$tag
            docker push ghcr.io/${{ github.repository_owner }}/cicy-code-base:$tag
            if [ -n "$ALIYUN_REGISTRY" ]; then
              docker tag cicy-code-base:${BASE_TAG} $ALIYUN_REGISTRY/$ALIYUN_NS/cicy-code-base:$tag
              docker push $ALIYUN_REGISTRY/$ALIYUN_NS/cicy-code-base:$tag
            fi
          done

      - name: Build & push cicy-code (runtime)
        # Runtime = base + cicy-code binary. Tagged with the release version
        # (no `v` prefix) plus `latest`.
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          BASE_TAG: 1.0.9
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY || secrets.ALIYUN_REGISTRY }}
          ALIYUN_NS: ${{ vars.ALIYUN_REGISTRY_NAMESPACE || secrets.ALIYUN_REGISTRY_NAMESPACE || 'cicy-ai' }}
        run: |
          set -e
          # Dockerfile.runtime expects api/cicy-code-docker — build.sh would
          # cp from api/cicy-code, but we already have dist/cicy-code-linux-amd64.
          cp dist/cicy-code-linux-amd64 api/cicy-code-docker
          docker build -f api/Dockerfile.runtime \
            --build-arg BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/cicy-code-base:${BASE_TAG} \
            -t cicy-code:${VERSION} \
            api/
          rm -f api/cicy-code-docker
          for tag in ${VERSION} latest; do
            docker tag cicy-code:${VERSION} ghcr.io/${{ github.repository_owner }}/cicy-code:$tag
            docker push ghcr.io/${{ github.repository_owner }}/cicy-code:$tag
            if [ -n "$ALIYUN_REGISTRY" ]; then
              docker tag cicy-code:${VERSION} $ALIYUN_REGISTRY/$ALIYUN_NS/cicy-code:$tag
              docker push $ALIYUN_REGISTRY/$ALIYUN_NS/cicy-code:$tag
            fi
          done

      - name: Generate release manifest
        # manifest.json is the canonical source the cicy-desktop installer
        # reads to discover the latest version + binary URLs. Hosted as a
        # release asset so:
        #   1. It's CN-reachable via ghproxy mirrors (same path as binaries).
        #   2. GitHub's /releases/latest/download/manifest.json redirects to
        #      whatever release was tagged "latest" — clients don't need to
        #      walk git tags.
        # Also pinned at the v<TAG> URL for clients that want a specific ver.
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cat > dist/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "darwin-amd64": "${BASE}/cicy-code-darwin-amd64",
              "darwin-arm64": "${BASE}/cicy-code-darwin-arm64",
              "linux-amd64":  "${BASE}/cicy-code-linux-amd64",
              "linux-arm64":  "${BASE}/cicy-code-linux-arm64"
            },
            "sizes": {
              "darwin-amd64": $(stat -c%s dist/cicy-code-darwin-amd64),
              "darwin-arm64": $(stat -c%s dist/cicy-code-darwin-arm64),
              "linux-amd64":  $(stat -c%s dist/cicy-code-linux-amd64),
              "linux-arm64":  $(stat -c%s dist/cicy-code-linux-arm64)
            }
          }
          EOF
          cat dist/manifest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # For workflow_dispatch, create the tag on the current commit if it
          # does not exist so the release has something to attach to.
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          # Step 1: ensure release exists (no assets — keep this command simple).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Step 2: upload each asset individually so a failure on one (e.g.
          # manifest.json) is visible. --clobber overwrites a prior upload of
          # the same asset name.
          for f in \
            dist/cicy-code-darwin-amd64 \
            dist/cicy-code-darwin-arm64 \
            dist/cicy-code-linux-amd64 \
            dist/cicy-code-linux-arm64 \
            dist/manifest.json; do
            echo "Uploading $f ..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Publish to npm
        # Only publish on real tag pushes — workflow_dispatch snapshots stay
        # GitHub-release-only to avoid burning npm version numbers.
        if: github.event_name == 'push'
        run: |
          cd npm
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
