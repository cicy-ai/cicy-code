; CiCy runtime — supervisord is PID 1 (replaces the old `exec cicy-code`).
;
; Why: the container runs several long-lived processes — cicy-code, the cron
; daemon, the SSH server, plus any daemons the USER adds on top. A single
; foreground `exec` can't restart a crashed child and can't hot-restart
; cicy-code on update. supervisord gives every process autorestart + log
; capture + individual `supervisorctl restart`, and (behind tini) clean
; shutdown / zombie reaping.
;
; Runs as the unprivileged `cicy` user (the container's USER); everything it
; writes lives under $HOME or /tmp so it never needs a writable /var.

[supervisord]
nodaemon=true
logfile=/home/cicy/cicy-ai/.cicy/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/supervisord.pid
childlogdir=/home/cicy/cicy-ai/.cicy/logs

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Two include trees:
;   conf.d/                — image-managed (cicy-code). Read-only.
;   ~/cicy-ai/supervisor/  — USER daemons. Drop a `<name>.conf` here (persists in
;                            the volume) and either restart the container or run:
;                                supervisorctl reread && supervisorctl update
[include]
files = /etc/supervisor/conf.d/*.conf /home/cicy/cicy-ai/supervisor/*.conf
