# CiCy SSH policy — RSA public-key authentication ONLY.
# Debian's /etc/ssh/sshd_config does `Include /etc/ssh/sshd_config.d/*.conf`
# at its very top, and sshd takes the FIRST value for each keyword, so these
# win over the shipped defaults.

Port 22
PermitRootLogin no
AllowUsers cicy

# No passwords / keyboard-interactive — public key is the only way in.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no

PubkeyAuthentication yes
AuthenticationMethods publickey
AuthorizedKeysFile .ssh/authorized_keys

# Accept RSA client keys only — reject ed25519 / ecdsa / dsa.
# (rsa-sha2-* are the modern RSA signature algorithms; ssh-rsa kept for older
# clients. All three are RSA, so non-RSA key types are refused.)
PubkeyAcceptedAlgorithms rsa-sha2-512,rsa-sha2-256,ssh-rsa
