; The main app. Runs the wrapper, which builds argv from env (--public/--cdn +
; any container args) and execs the STABLE symlink ~/.local/bin/cicy-code.
;
; Update model (mirrors cicy-desktop mac hot-patch + the mihomo runtime store):
; a new version is installed side-by-side under ~/.local/cicy-code/<ver>,
; the ~/.local/bin/cicy-code symlink is repointed, and ONLY this program is
; restarted — `cicy-code-update [version]`. The container, the tunnel, and user
; daemons all keep running.
[program:cicy-code]
command=/usr/local/bin/cicy-code-run.sh
directory=/home/cicy
autostart=true
autorestart=true
startsecs=3
startretries=999
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
; Forward to the container's stdout/stderr so `docker logs` shows cicy-code.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10
