; OpenSSH server — RSA public-key login only, no passwords. supervisord itself
; is unprivileged (cicy), so sshd is launched through the NOPASSWD sudo already
; granted to cicy; that lets it bind :22 and run privilege separation. Host
; keys, /run/sshd and ~/.ssh/authorized_keys are prepared by the entrypoint;
; the auth policy lives in /etc/ssh/sshd_config.d/cicy.conf.
[program:sshd]
command=/usr/bin/sudo -n /usr/sbin/sshd -D -e
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30
