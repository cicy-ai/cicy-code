; cron daemon — lets users schedule jobs with `crontab -e`. Launched as root
; via sudo (supervisord runs as cicy) so it can run each user's crontab as that
; user. -f keeps it in the foreground for supervisor; -L 15 logs to syslog/stdout.
[program:cron]
command=/usr/bin/sudo -n /usr/sbin/cron -f -L 15
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=40
