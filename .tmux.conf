# cicy-code tmux.conf v2
set -g default-terminal "xterm-256color"
set -g mouse on
# 鼠标选中后自动复制到系统剪贴板
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

set-option -g window-size largest
set-option -g aggressive-resize on
set-option -g history-limit 1000

# Make every new window/pane a bash shell whose init file we fully control.
# Using --rcfile pins shell setup to ~/.cicy_shell_init (managed by cicy-code),
# which sources ~/.bashrc (if any) and then ~/.cicy_tmux.conf. This avoids
# fragile chains via .bashrc — which may not exist, may early-return on
# non-interactive checks, or may simply not be the user's login-shell rcfile.
set-option -g default-command "bash --rcfile $HOME/.cicy_shell_init -i"

# hide the bottom status line (the web UI provides its own chrome)
set -g status off
