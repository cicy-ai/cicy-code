# cicy-code tmux.conf v3
set -g default-terminal "xterm-256color"
set -g mouse on
# Copy on mouse selection: with xclip (X11 desktop) copy to the system
# clipboard; without it (headless server / Google Cloud Shell) fall back to
# tmux's internal buffer. Otherwise xclip errors on every drag-select, and the
# error text pollutes the pane, breaking cicy's prompt detection → boot.sh gets
# skipped → a cascade of problems.
#
# NOTE: the MouseDragEnd1Pane key name + `send-keys -X` copy commands were only
# finalized in tmux 2.4. Old tmux (e.g. Google Cloud Shell's 2.1) prints
# "unknown key: MouseDragEnd1Pane" on load and pollutes the pane. So guard the
# whole block behind a >= 2.4 version check; older versions just skip it (mouse
# on already allows select/scroll, only the copy binding is dropped).
if-shell 'v=$(tmux -V | grep -oE "[0-9]+\.[0-9]+" | head -1); maj=${v%%.*}; min=${v##*.}; { [ "${maj:-0}" -gt 2 ] || { [ "${maj:-0}" -eq 2 ] && [ "${min:-0}" -ge 4 ]; }; } && command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"'
if-shell 'v=$(tmux -V | grep -oE "[0-9]+\.[0-9]+" | head -1); maj=${v%%.*}; min=${v##*.}; { [ "${maj:-0}" -gt 2 ] || { [ "${maj:-0}" -eq 2 ] && [ "${min:-0}" -ge 4 ]; }; } && ! command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel'
if-shell 'v=$(tmux -V | grep -oE "[0-9]+\.[0-9]+" | head -1); maj=${v%%.*}; min=${v##*.}; { [ "${maj:-0}" -gt 2 ] || { [ "${maj:-0}" -eq 2 ] && [ "${min:-0}" -ge 4 ]; }; } && command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"'
if-shell 'v=$(tmux -V | grep -oE "[0-9]+\.[0-9]+" | head -1); maj=${v%%.*}; min=${v##*.}; { [ "${maj:-0}" -gt 2 ] || { [ "${maj:-0}" -eq 2 ] && [ "${min:-0}" -ge 4 ]; }; } && ! command -v xclip >/dev/null 2>&1' 'bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel'

# window-size is a tmux 2.9+ option — old tmux prints
# "unknown option: window-size" on config load, polluting the pane the same way.
# Guard it behind a version check.
if-shell 'v=$(tmux -V | grep -oE "[0-9]+\.[0-9]+" | head -1); maj=${v%%.*}; min=${v##*.}; [ "${maj:-0}" -gt 2 ] || { [ "${maj:-0}" -eq 2 ] && [ "${min:-0}" -ge 9 ]; }' 'set-option -g window-size largest'
set-option -g aggressive-resize on
set-option -g history-limit 200

# Make every new window/pane a bash shell whose init file we fully control.
# Using --rcfile pins shell setup to ~/.cicy_shell_init (managed by cicy-code),
# which sources ~/.bashrc (if any) and then ~/.cicy_tmux.conf. This avoids
# fragile chains via .bashrc — which may not exist, may early-return on
# non-interactive checks, or may simply not be the user's login-shell rcfile.
set-option -g default-command "BASH_SILENCE_DEPRECATION_WARNING=1 bash --rcfile $HOME/.cicy_shell_init -i"

# forward host-terminal focus events (CSI I / CSI O) into pane programs —
# claude/codex/opencode TUIs use these to know when their tab/window goes
# background, so they can pause renders + skip redundant file re-scans on
# focus loss, and immediately re-check git/buffer state on focus gain. tmux
# eats focus events by default; without this opt-in, claude prints
# "tmux focus-events off · add 'set -g focus-events on'" as a startup hint.
set -g focus-events on

# hide the bottom status line (the web UI provides its own chrome)
set -g status off
