# opencode-mitm — opencode CLI behind cicy-mitm + dev mihomo.
#
# Pre-reqs on host:
#   - dev mihomo on 127.0.0.1:9002 (with cicy-mitm-group rule)
#   - cicy-mitm on 127.0.0.1:1085
#   - /tmp/mitm-prod-ca.crt readable
#
# Usage:
#   OPENROUTER_API_KEY=sk-or-... docker compose -f docker-compose.yml run --rm opencode

version: "3.9"

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-mitm:latest
    # --network host is the simplest way to reach the host's mihomo + MITM.
    # On macOS / Windows replace with the host.docker.internal mapping (see README).
    network_mode: host
    volumes:
      # MITM CA — must match cert_path in ~/cicy-ai/mitm/config.json.
      - /tmp/mitm-prod-ca.crt:/usr/local/share/ca-certificates/cicy-mitm.crt:ro
      # Persist opencode config + conversation history.
      - ${HOME}/.config/opencode:/root/.config/opencode
      # Optional: surface a project workspace.
      - ${PWD}:/workspace
    environment:
      ALL_PROXY: "socks5h://127.0.0.1:9002"
      OPENCODE_HEALTHCHECK: "1"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    stdin_open: true
    tty: true
