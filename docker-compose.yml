services:
  app-dev:
    image: node:20-alpine
    container_name: cicy-app-dev
    working_dir: /app
    network_mode: host
    volumes:
      - ./app:/app
      - app_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  landing-dev:
    image: node:20-alpine
    container_name: cicy-landing-dev
    working_dir: /app
    network_mode: host
    volumes:
      - /home/w3c_offical/projects/cicy-landing:/app
      - landing_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

  cloud-dev:
    image: node:20-alpine
    container_name: cicy-cloud-dev
    working_dir: /app
    network_mode: host
    volumes:
      - /home/w3c_offical/projects/cicy-cloud/app:/app
      - cloud_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --port 5174 --host 0.0.0.0 --strictPort"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  app_modules:
  landing_modules:
  cloud_modules:
